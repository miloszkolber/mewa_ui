<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/ui/src/base.css"><link rel="stylesheet" href="/ui/src/mewa.css"><link rel="stylesheet" href="/ui/src/demo.css"><script src="/ui/src/components.js" defer></script><title>Autocomplete</title></head><body class="ui-demo">
<!-- mewa-ui-snippet:start -->
<section class="ui-autocomplete" data-ui-component="autocomplete">
  <label class="ui-field-label" for="autocomplete-city">City</label>
  <div class="ui-input-group"><svg aria-hidden="true"><use href="/ui/src/lucide.svg#search"></use></svg><input class="ui-field" data-ui-part="input" id="autocomplete-city" name="city" type="text" value="Warsaw" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="autocomplete-city-list" aria-describedby="autocomplete-city-help"></div>

  <ul data-ui-part="listbox" id="autocomplete-city-list" role="listbox" hidden><li id="autocomplete-city-warsaw" role="option" data-value="Warsaw">Warsaw</li><li id="autocomplete-city-wroclaw" role="option" data-value="Wrocław">Wrocław</li><li id="autocomplete-city-krakow" role="option" data-value="Kraków">Kraków</li><li id="autocomplete-city-gdansk" role="option" data-value="Gdańsk">Gdańsk</li></ul>
  <p class="ui-meta-text" data-ui-part="empty" hidden>No matching suggestions. Your text will be kept.</p>
</section>
<!-- mewa-ui-snippet:end -->
</body></html>
