<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/ui/src/base.css"><link rel="stylesheet" href="/ui/src/mewa.css"><link rel="stylesheet" href="/ui/src/demo.css"><script src="/ui/src/components.js" defer></script><title>Time field</title></head><body class="ui-demo">
<!-- mewa-ui-snippet:start -->
<fieldset class="ui-time-field" data-ui-component="time-field" aria-describedby="time-field-help time-field-status">
  <legend>Reminder time</legend>
  <div class="ui-time-field-group" role="group" aria-label="Reminder time">
    <input class="ui-field" data-ui-part="hour" type="text" value="09" inputmode="numeric" maxlength="2" aria-label="Hour">
    <span aria-hidden="true">:</span>
    <input class="ui-field" data-ui-part="minute" type="text" value="30" inputmode="numeric" maxlength="2" aria-label="Minute">
    <select class="ui-select" data-ui-part="period" aria-label="Period"><option value="AM" selected>AM</option><option value="PM">PM</option></select>
    <input data-ui-part="value" type="hidden" name="reminder_time" value="09:30">
  </div>
  <p class="ui-meta-text" id="time-field-help">Use Up or Down to step the focused segment.</p>
  <output class="ui-sr-only" data-ui-part="status" id="time-field-status" aria-live="polite">09:30 AM</output>
</fieldset>
<!-- mewa-ui-snippet:end -->
</body></html>
