<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/ui/src/base.css"><link rel="stylesheet" href="/ui/src/mewa.css"><link rel="stylesheet" href="/ui/src/demo.css"><script src="/ui/src/components.js" defer></script><title>Chart</title></head><body class="ui-demo ui-demo-wide">
<!-- mewa-ui-snippet:start -->
<section data-ui-component="chart" data-ui-chart aria-labelledby="chart-title">
  <header><div><h2 id="chart-title" class="ui-title-md">Weekly active users</h2><p class="ui-meta-text">August 10–14, 2026</p></div><span class="ui-badge" data-state="ok">+100%</span></header>
  <figure data-ui-part="plot" aria-describedby="chart-summary chart-data-caption">
    <div class="ui-chart-canvas"><svg role="img" aria-labelledby="chart-svg-title chart-svg-description" viewBox="0 0 640 240"><title id="chart-svg-title">Weekly active users increased during the week</title><desc id="chart-svg-description">Active users were 120 on Monday, 160 on Tuesday, 150 on Wednesday, 210 on Thursday, and 240 on Friday.</desc><g class="ui-chart-grid" aria-hidden="true"><line x1="24" y1="20" x2="616" y2="20"></line><line x1="24" y1="120" x2="616" y2="120"></line><line x1="24" y1="220" x2="616" y2="220"></line></g><path class="ui-chart-line" d="M24 200 L172 133 L320 150 L468 67 L616 20"></path><g class="ui-chart-points" aria-hidden="true"><circle cx="24" cy="200" r="5"></circle><circle cx="172" cy="133" r="5"></circle><circle cx="320" cy="150" r="5"></circle><circle cx="468" cy="67" r="5"></circle><circle cx="616" cy="20" r="5"></circle></g></svg><span class="ui-chart-value ui-chart-value-start" aria-hidden="true">120</span><span class="ui-chart-value ui-chart-value-end" aria-hidden="true">240</span></div>
    <ol class="ui-chart-labels" aria-hidden="true"><li>Mon</li><li>Tue</li><li>Wed</li><li>Thu</li><li>Fri</li></ol>
    <figcaption id="chart-summary">Active users increased by 120 people from Monday to Friday. Friday was the weekly high at 240.</figcaption>
  </figure>
  <details class="ui-chart-data"><summary>View source data</summary><div class="ui-table-wrap" data-ui-part="table"><table class="ui-table"><caption id="chart-data-caption">Daily active user data shown in the chart</caption><thead><tr><th scope="col">Day</th><th scope="col">Active users</th><th scope="col">Change</th></tr></thead><tbody><tr><th scope="row">Monday</th><td>120</td><td>—</td></tr><tr><th scope="row">Tuesday</th><td>160</td><td>+40</td></tr><tr><th scope="row">Wednesday</th><td>150</td><td>−10</td></tr><tr><th scope="row">Thursday</th><td>210</td><td>+60</td></tr><tr><th scope="row">Friday</th><td>240</td><td>+30</td></tr></tbody></table></div></details>
</section>
<!-- mewa-ui-snippet:end -->
</body></html>
