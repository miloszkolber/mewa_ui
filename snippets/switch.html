<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Switch</title><link rel="stylesheet" href="/ui/src/base.css"><link rel="stylesheet" href="/ui/src/components.css"><script src="/ui/src/components.js" defer></script></head><body class="ui-demo"><main class="ui-container"><h1 class="ui-page-heading">Switch</h1><p class="ui-description">An immediate on or off preference control.</p><!-- mewa-ui-snippet:start --><div class="ui-switch-list"><label class="ui-switch-label" for="switch-updates"><span><span class="ui-switch-title">Automatic updates</span><span class="ui-switch-description">Install security updates overnight.</span></span><input class="ui-switch" id="switch-updates" name="automatic-updates" type="checkbox" role="switch" checked><span class="ui-switch-control" aria-hidden="true"></span></label><label class="ui-switch-label" for="switch-disabled"><span><span class="ui-switch-title">Experimental features</span><span class="ui-switch-description">Unavailable for this workspace.</span></span><input class="ui-switch" id="switch-disabled" name="experimental-features" type="checkbox" role="switch" disabled><span class="ui-switch-control" aria-hidden="true"></span></label><label class="ui-switch-label" for="switch-email"><span><span class="ui-switch-title">Email notifications</span><span class="ui-switch-description">Choose a verified email address first.</span></span><input class="ui-switch" id="switch-email" name="email-notifications" type="checkbox" role="switch" required aria-invalid="true" aria-describedby="switch-email-error"><span class="ui-switch-control" aria-hidden="true"></span></label><p class="ui-field-error" id="switch-email-error">A verified email address is required.</p></div><!-- mewa-ui-snippet:end --></main></body></html>
