<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Progress</title><link rel="stylesheet" href="/ui/src/base.css"><link rel="stylesheet" href="/ui/src/mewa.css"><link rel="stylesheet" href="/ui/src/demo.css"><script src="/ui/src/components.js" defer></script></head><body class="ui-demo"><main class="ui-container"><h1 class="ui-page-heading">Progress</h1><p class="ui-description">Native progress and meter states with visible values.</p>
<!-- mewa-ui-snippet:start -->
<div class="ui-progress-list">
  <section class="ui-progress-group" aria-labelledby="progress-upload-label">
    <div class="ui-progress-header"><span id="progress-upload-label">Uploading report</span><output for="progress-upload">64% complete</output></div>
    <progress class="ui-progress" id="progress-upload" value="64" max="100" aria-labelledby="progress-upload-label">64%</progress>
  </section>
  <section class="ui-progress-group" data-state="running" aria-labelledby="progress-running-label">
    <div class="ui-progress-header"><span id="progress-running-label"><svg class="ui-spin" aria-hidden="true"><use href="/ui/src/lucide.svg#loader-circle"></use></svg>Preparing archive</span><output for="progress-running">In progress</output></div>
    <progress class="ui-progress" id="progress-running" aria-labelledby="progress-running-label">In progress</progress>
  </section>
  <section class="ui-progress-group" data-state="ok" aria-labelledby="meter-coverage-label">
    <div class="ui-progress-header"><span id="meter-coverage-label">Test coverage</span><output for="meter-coverage">92%</output></div>
    <meter class="ui-progress" id="meter-coverage" min="0" max="100" low="70" high="90" optimum="100" value="92" aria-labelledby="meter-coverage-label">92%</meter>
  </section>
  <section class="ui-progress-group" data-state="warning" aria-labelledby="meter-storage-label">
    <div class="ui-progress-header"><span id="meter-storage-label">Storage used</span><output for="meter-storage">78%</output></div>
    <meter class="ui-progress" id="meter-storage" min="0" max="100" low="60" high="85" optimum="20" value="78" aria-labelledby="meter-storage-label">78%</meter>
  </section>
</div>
<!-- mewa-ui-snippet:end -->
</main></body></html>
