<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vertical rail layout</title>
    <link rel="stylesheet" href="/ui/src/base.css">
    <link rel="stylesheet" href="/ui/src/components.css">
    <script src="/ui/src/components.js" defer></script>
</head>
<body class="ui-shell ui-shell--rail">
    <a class="ui-skip-link" href="#main-content">Skip to main content</a>
    <div class="ui-frame">
        <nav class="ui-rail" aria-label="Workspace navigation">
            <a href="#overview" aria-label="Atlas home">
                <svg aria-hidden="true"><use href="/ui/src/lucide.svg#layers-3"></use></svg>
            </a>
            <a href="#overview" aria-current="page" aria-label="Overview">
                <svg aria-hidden="true"><use href="/ui/src/lucide.svg#layout-dashboard"></use></svg>
            </a>
            <a href="#projects" aria-label="Projects">
                <svg aria-hidden="true"><use href="/ui/src/lucide.svg#folder-kanban"></use></svg>
            </a>
            <a href="#activity" aria-label="Activity">
                <svg aria-hidden="true"><use href="/ui/src/lucide.svg#activity"></use></svg>
            </a>
            <a href="#settings" aria-label="Settings">
                <svg aria-hidden="true"><use href="/ui/src/lucide.svg#settings"></use></svg>
            </a>
        </nav>
        <main class="ui-shell-main" id="main-content">
            <section class="ui-panel" aria-labelledby="page-title">
                <header class="ui-panel-header">
                    <div>
                        <p class="ui-eyebrow">Workspace</p>
                        <h1 class="ui-page-heading" id="page-title">Overview</h1>
                    </div>
                    <a class="ui-button ui-button-primary" href="#new-project">New project</a>
                </header>
                <div class="ui-panel-body">
                    <p class="ui-description">A large framed content surface keeps work separate from the striped application gutters.</p>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
