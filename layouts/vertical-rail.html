<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vertical rail layout</title>
    <link rel="stylesheet" href="/ui/src/base.css">
    <link rel="stylesheet" href="/ui/src/components.css">
    <script src="/ui/src/components.js" defer></script>
</head>
<body class="ui-framed-app">
    <a class="ui-skip-link" href="#main-content">Skip to main content</a>
    <header class="ui-app-header">
        <div class="ui-app-header-inner">
            <a class="ui-brand" href="#overview" aria-label="Atlas home">
                <svg class="ui-brand-logo" aria-hidden="true"><use href="/ui/src/lucide.svg#layers-3"></use></svg>
                <span>Atlas</span>
            </a>
        </div>
    </header>
    <main id="main-content">
        <div class="ui-framed-workspace ui-framed-split">
            <aside class="ui-framed-region" aria-label="Application rail">
                <nav aria-label="Primary navigation">
                    <a class="ui-icon-button" href="#overview" aria-current="page">
                        <svg aria-hidden="true"><use href="/ui/src/lucide.svg#layout-dashboard"></use></svg>
                        <span class="ui-sr-only">Overview</span>
                    </a>
                    <a class="ui-icon-button" href="#projects">
                        <svg aria-hidden="true"><use href="/ui/src/lucide.svg#folder-kanban"></use></svg>
                        <span class="ui-sr-only">Projects</span>
                    </a>
                    <a class="ui-icon-button" href="#activity">
                        <svg aria-hidden="true"><use href="/ui/src/lucide.svg#activity"></use></svg>
                        <span class="ui-sr-only">Activity</span>
                    </a>
                    <a class="ui-icon-button" href="#settings">
                        <svg aria-hidden="true"><use href="/ui/src/lucide.svg#settings"></use></svg>
                        <span class="ui-sr-only">Settings</span>
                    </a>
                </nav>
            </aside>
            <section class="ui-framed-region ui-panel" aria-labelledby="page-title">
                <header class="ui-panel-header">
                    <div>
                        <p class="ui-eyebrow">Workspace</p>
                        <h1 class="ui-page-heading" id="page-title">Overview</h1>
                    </div>
                    <a class="ui-button ui-button-primary" href="#new-project">New project</a>
                </header>
                <div class="ui-panel-body">
                    <p class="ui-description">A large framed content surface keeps work separate from the striped application gutters.</p>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
