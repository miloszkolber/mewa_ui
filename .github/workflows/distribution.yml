name: Distribution

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --run test
      - run: node --run test:browser
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - name: Verify release commit belongs to master
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin master:refs/remotes/origin/master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - name: Create GitHub release archives
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p release
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -czf "release/mewa-ui-${version}.tar.gz" -C dist mewa-ui
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -czf "release/mewa-icons-${version}.tar.gz" -C dist mewa-icons
          cd release
          sha256sum mewa-*.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
          cd ..
          verify_dir=$(mktemp -d)
          trap 'rm -rf "$verify_dir"' EXIT
          tar -xzf "release/mewa-ui-${version}.tar.gz" -C "$verify_dir"
          tar -xzf "release/mewa-icons-${version}.tar.gz" -C "$verify_dir"
          diff -qr dist/mewa-ui "$verify_dir/mewa-ui"
          diff -qr dist/mewa-icons "$verify_dir/mewa-icons"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mewa-ui-${{ github.sha }}
          path: release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mewa-ui-${{ github.sha }}
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
