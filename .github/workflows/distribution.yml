name: Distribution

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      # Both engines are pinned so CI verifies the same builds as local review.
      # An unpinned Chrome silently tests whatever the runner image ships.
      - name: Install pinned test browsers
        run: |
          bun -e 'import {install, Browser} from "@puppeteer/browsers"; await install({browser: Browser.CHROME, buildId: "153.0.8010.52", cacheDir: "/tmp/mewa-ui-browsers"});'
          bun -e 'import {install, Browser} from "@puppeteer/browsers"; await install({browser: Browser.FIREFOX, buildId: "stable_155.0.1", cacheDir: "/tmp/mewa-ui-browsers"});'
      - name: Resolve pinned browser executables
        run: |
          for browser in chrome firefox; do
            upper=$(printf '%s' "$browser" | tr '[:lower:]' '[:upper:]')
            found=$(bun -e "import {getInstalledBrowsers, Browser} from '@puppeteer/browsers'; const all = await getInstalledBrowsers({cacheDir: '/tmp/mewa-ui-browsers'}); console.log(all.find((entry) => entry.browser === Browser.${upper})?.executablePath ?? '');")
            if [ -z "$found" ]; then echo "::error::No pinned $browser executable resolved"; exit 1; fi
            echo "${upper}_EXECUTABLE=$found" >> "$GITHUB_ENV"
          done
      - name: Verify Chrome
        run: bun run test:browser
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ env.CHROME_EXECUTABLE }}
      - run: bun run test:consumer
      - name: Verify Firefox
        run: bun run test:browser
        env:
          MEWA_BROWSER: firefox
          PUPPETEER_EXECUTABLE_PATH: ${{ env.FIREFOX_EXECUTABLE }}
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(bun -e 'console.log(require("./package.json").version)')"
      - name: Verify release commit belongs to master
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin master:refs/remotes/origin/master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - name: Create GitHub release archives
        run: |
          version=$(bun -e 'console.log(require("./package.json").version)')
          mkdir -p release
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -czf "release/mewa-ui-${version}.tar.gz" -C dist mewa-ui
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -czf "release/mewa-icons-${version}.tar.gz" -C dist mewa-icons
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -czf "release/mewa-svelte-${version}.tar.gz" -C dist mewa-svelte
          cd release
          sha256sum mewa-*.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
          cd ..
          verify_dir=$(mktemp -d)
          trap 'rm -rf "$verify_dir"' EXIT
          tar -xzf "release/mewa-ui-${version}.tar.gz" -C "$verify_dir"
          tar -xzf "release/mewa-icons-${version}.tar.gz" -C "$verify_dir"
          tar -xzf "release/mewa-svelte-${version}.tar.gz" -C "$verify_dir"
          diff -qr dist/mewa-ui "$verify_dir/mewa-ui"
          diff -qr dist/mewa-icons "$verify_dir/mewa-icons"
          diff -qr dist/mewa-svelte "$verify_dir/mewa-svelte"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mewa-ui-${{ github.sha }}
          path: release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mewa-ui-${{ github.sha }}
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
